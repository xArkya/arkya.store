<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arkya Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #241521;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      color: #d53f8c;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    p {
      margin-bottom: 30px;
      font-size: 1.2rem;
    }
    a {
      color: #d53f8c;
      text-decoration: none;
      border: 1px solid #d53f8c;
      padding: 10px 20px;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }
    a:hover {
      background-color: #d53f8c;
      color: white;
    }
    .loader {
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top: 5px solid #d53f8c;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Script to redirect to the correct path while preserving the route
    (function() {
      var pathSegmentsToKeep = 1; // Keep the 'arkya.store' segment
      var l = window.location;
      
      // Don't redirect if we're already at the base path
      if (l.pathname.split('/')[1] === 'arkya.store') {
        return;
      }
      
      // Redirect to the correct base path
      var basePath = '/arkya.store/';
      
      // If we're at a subpath, append it to the base path
      if (l.pathname.length > 0) {
        // Remove any leading slashes and add the path to the base
        var path = l.pathname.split('/').slice(pathSegmentsToKeep).join('/');
        if (path) {
          basePath += path;
        }
      }
      
      // Add any query parameters or hash
      if (l.search) {
        basePath += l.search;
      }
      if (l.hash) {
        basePath += l.hash;
      }
      
      // Redirect after a short delay
      setTimeout(function() {
        window.location.href = basePath;
      }, 1500);
    })();
  </script>
</head>
<body>
  <h1>Arkya Store</h1>
  <div class="loader"></div>
  <p>Redireccionando a la tienda...</p>
  <a href="/arkya.store/">Ir a la tienda</a>
</body>
</html>
