<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Arkya Store</title>
  <script type="text/javascript">
    // Truco SPA para GitHub Pages - Guarda la ruta y redirige
    var segmentCount = 0; // Dominio raiz (arkya.store)
    var l = window.location;
    var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/';

    // Guardar la ruta completa para recuperarla en index.html
    var path = l.pathname;
    var search = l.search;
    var hash = l.hash;

    sessionStorage.setItem('spa-redirect', JSON.stringify({
      path: path,
      search: search,
      hash: hash
    }));

    // Redirigir a la raiz
    l.replace(redirectUrl);
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #241521;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top: 5px solid #d53f8c;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Redireccionando...</p>
</body>
</html>
