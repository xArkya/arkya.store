[build]
  publish = "dist"

# cycletls trae binarios de Go: no se puede bundlear; el require está
# oculto del tracer así que hay que forzar la inclusión de los archivos.
[functions."jp-probe"]
  included_files = ["node_modules/cycletls/**", "node_modules/ws/**", "node_modules/form-data/**", "node_modules/asynckit/**", "node_modules/combined-stream/**", "node_modules/delayed-stream/**", "node_modules/es-set-tostringtag/**", "node_modules/es-errors/**", "node_modules/get-intrinsic/**", "node_modules/call-bind-apply-helpers/**", "node_modules/function-bind/**", "node_modules/es-define-property/**", "node_modules/es-object-atoms/**", "node_modules/get-proto/**", "node_modules/dunder-proto/**", "node_modules/gopd/**", "node_modules/has-symbols/**", "node_modules/hasown/**", "node_modules/math-intrinsics/**", "node_modules/has-tostringtag/**", "node_modules/mime-types/**", "node_modules/mime-db/**"]

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirect www to non-www (must be before other redirects)
[[redirects]]
  from = "https://www.arkya.store/*"
  to = "https://arkya.store/:splat"
  status = 301
  force = true

# Redirect /products/* to /product/* (singular)
[[redirects]]
  from = "/products/:slug"
  to = "/product/:slug"
  status = 301

# API: buscador de catálogo + proxy de imágenes -> Netlify Functions
[[redirects]]
  from = "/api/jp-search"
  to = "/.netlify/functions/jp-search"
  status = 200

[[redirects]]
  from = "/api/jp-image"
  to = "/.netlify/functions/jp-image"
  status = 200

# Serve SPA - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  path = "/*"
  function = "block-countries"
